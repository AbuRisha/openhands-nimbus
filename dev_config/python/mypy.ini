[mypy]
warn_unused_configs = True
ignore_missing_imports = True
check_untyped_defs = True
explicit_package_bases = True
warn_unreachable = True
warn_redundant_casts = True
no_implicit_optional = True
strict_optional = True
disable_error_code = type-abstract

# This runs in Linux containers, so type-check it as Linux regardless of who is
# running mypy. Without this, mypy on a Windows workstation defaults to
# sys.platform=win32 and rejects correct POSIX-only code (os.chown in
# process_sandbox_service is the standing example), which made the pre-commit
# hook unpassable on Windows for reasons CI never saw.
#
# Keep this file ASCII-only: configparser opens it with the locale codepage, so
# on a cp932 box a stray em dash is a UnicodeDecodeError before mypy even starts.
platform = linux

# Exclude third-party runtime directory from type checking
exclude = (enterprise/)

[mypy-openai.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-litellm.*]
follow_imports = skip
ignore_missing_imports = True
